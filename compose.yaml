name: twitch-dock-drops

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: twitch-dock-drops:local
    init: true
    restart: unless-stopped
    ports:
      - "${TWITCH_DROPS_BIND:-127.0.0.1}:${TWITCH_DROPS_PORT:-8080}:8080"
    environment:
      TWITCH_DROPS_DATA_DIR: /data
      TWITCH_DROPS_PORT: 8080
      TWITCH_DROPS_LISTEN_HOST: 0.0.0.0
      TWITCH_DROPS_ALLOW_LAN: "${TWITCH_DROPS_ALLOW_LAN:-false}"
      TWITCH_DROPS_TRUSTED_HOSTS: "${TWITCH_DROPS_TRUSTED_HOSTS:-127.0.0.1,localhost,[::1]}"
      TWITCH_DROPS_TRUSTED_ORIGINS: "${TWITCH_DROPS_TRUSTED_ORIGINS:-http://127.0.0.1:*,http://localhost:*,http://[::1]:*}"
      JAVA_OPTS: "${TWITCH_DROPS_JAVA_OPTS:--Xms16m -Xmx256m -XX:+UseSerialGC -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=32m -XX:MaxDirectMemorySize=32m -Dfile.encoding=UTF-8}"
      # Prefer injecting this from a secret manager instead of .env.
      TWITCH_DROPS_SESSION_KEY: ${TWITCH_DROPS_SESSION_KEY:-}
    volumes:
      - twitch-dock-drops-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/health | grep -q '\"status\":\"ok\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 2s

volumes:
  twitch-dock-drops-data:
    name: twitch-dock-drops-data
